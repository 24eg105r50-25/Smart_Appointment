<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Hospital | Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand-mark" aria-hidden="true">+</div>
      <p class="eyebrow">SMART HOSPITAL</p>
      <h1>Dashboard</h1>
      <p class="subtext" id="welcome">You have signed in successfully.</p>
      <button onclick="window.location.href='http://localhost:8080/login'">Open full portal</button>
      <button id="logout">Log out</button>
    </section>
  </main>
  <script>
    const user = JSON.parse(sessionStorage.getItem("hospitalUser") || "null");
    if (!user) {
      window.location.href = "index.html";
    } else {
      document.getElementById("welcome").textContent =
        "Signed in as " + user.username + " (" + user.role + ").";
    }
    document.getElementById("logout").addEventListener("click", () => {
      sessionStorage.removeItem("hospitalUser");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
