spring.application.name=smart-hospital
server.port=8080

# Database (override with environment variables, e.g. in Docker)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_hospital?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=false

# Default admin account created on first start (change in production!)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
